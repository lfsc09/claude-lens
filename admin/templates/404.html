{{ define "title" }}Not Found – claude-lens Admin{{ end }}
{{ define "content" }}
<div class="text-center py-24">
  <p class="text-5xl font-bold text-gray-200 mb-4">404</p>
  {{ if .ID }}
  <p class="text-gray-500 mb-6">Exchange #{{ .ID }} was not found.</p>
  {{ else }}
  <p class="text-gray-500 mb-6">Page not found.</p>
  {{ end }}
  <a href="{{ urlFor "ui_exchanges" }}" class="text-sm text-blue-600 hover:underline">← Back to exchanges</a>
</div>
{{ end }}

{{ template "base" . }}
