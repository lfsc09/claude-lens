{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}claude-lens Admin{{ end }}</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800">

  <header class="bg-white border-b border-gray-200 px-6 py-3">
    <nav class="flex items-center gap-6 text-sm font-medium">
      <span class="flex items-center gap-2">
        <img src="/static/logo.png" alt="" class="h-6 w-6 rounded-md">
        <span class="text-base font-bold text-gray-900">claude-lens</span>
      </span>
      <a href="{{ urlFor "ui_dashboard" }}" class="text-gray-600 hover:text-gray-900">Dashboard</a>
      <a href="{{ urlFor "ui_exchanges" }}" class="text-gray-600 hover:text-gray-900">Exchanges</a>
      <a href="{{ urlFor "ui_prices" }}" class="text-gray-600 hover:text-gray-900">Prices</a>
      <span id="proxy-status" class="ml-auto px-2 py-1 border border-gray-300 border-dashed text-xs text-gray-500">
        Proxy Service
      </span>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    {{ block "content" . }}{{ end }}
  </main>

  <div id="app-tooltip" role="tooltip" class="fixed z-50 max-w-xs px-2.5 py-1.5 rounded-md bg-gray-600 text-white text-xs leading-snug shadow-lg pointer-events-none whitespace-pre-line opacity-0 transition-opacity duration-150"></div>

  <script>
    // Single floating tooltip driven by [data-tip] elements. A per-cell
    // absolutely-positioned tooltip would get clipped by the tables'
    // overflow-x-auto wrappers, so this uses one fixed-position element
    // repositioned on hover/focus instead.
    (() => {
      const tip = document.getElementById('app-tooltip');
      let activeEl = null;

      function positionTip(el) {
        const rect = el.getBoundingClientRect();
        const tipRect = tip.getBoundingClientRect();
        let left = rect.left + rect.width / 2 - tipRect.width / 2;
        left = Math.max(4, Math.min(left, window.innerWidth - tipRect.width - 4));
        let top = rect.top - tipRect.height - 8;
        if (top < 4) top = rect.bottom + 8;
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
      }

      function showTip(el) {
        const textOrHtml = el.getAttribute('data-tip');
        if (!textOrHtml) return;
        tip.innerHTML = textOrHtml;
        activeEl = el;
        tip.classList.remove('opacity-0');
        tip.classList.add('opacity-100');
        positionTip(el);
      }

      function hideTip() {
        activeEl = null;
        tip.classList.remove('opacity-100');
        tip.classList.add('opacity-0');
      }

      document.addEventListener('mouseover', (e) => {
        const el = e.target.closest('[data-tip]');
        if (el) showTip(el);
      });
      document.addEventListener('mouseout', (e) => {
        if (activeEl && e.target.closest('[data-tip]') === activeEl) hideTip();
      });
      document.addEventListener('focusin', (e) => {
        const el = e.target.closest('[data-tip]');
        if (el) showTip(el);
      });
      document.addEventListener('focusout', (e) => {
        if (activeEl && e.target.closest('[data-tip]') === activeEl) hideTip();
      });
      document.addEventListener('scroll', () => {
        if (activeEl) positionTip(activeEl);
      }, true);
      window.addEventListener('resize', hideTip);
    })();
  </script>

  <script>
    // Mirrors admin/template.go's fmtTokens: values under 1000 render as
    // plain integers, larger values abbreviate to 1 decimal place (1.7k,
    // 6.3M, 1.2B) so SSE-updated cells match the server-rendered ones.
    function fmtTokens(n) {
      if (n == null) return '—';
      const neg = n < 0;
      const abs = Math.abs(n);
      let suffix, divisor;
      if (abs >= 1000000000) { suffix = 'B'; divisor = 1000000000; }
      else if (abs >= 1000000) { suffix = 'M'; divisor = 1000000; }
      else if (abs >= 1000) { suffix = 'k'; divisor = 1000; }
      else return `${neg ? '-' : ''}${abs}`;
      const val = (abs / divisor).toFixed(1).replace(/\.0$/, '');
      return `${neg ? '-' : ''}${val}${suffix}`;
    }

    (() => {
      // Keeps the dashboard's stat cards in sync with whichever range is
      // selected there (?range=...) — see admin/date_range.go. Other pages
      // don't have a "range" param or matching totals-* elements, so this
      // just falls through to the server's default range harmlessly.
      const range = new URLSearchParams(window.location.search).get('range');
      const es = new EventSource('/stream' + (range ? `?range=${encodeURIComponent(range)}` : ''));

      es.onmessage = (e) => {
        const data = JSON.parse(e.data);
        updateProxyStatus(data.proxy_status);
        updateTotals(data.totals);
        checkExchangesUpdate(data.latest_exchange_id);
      };

      es.onerror = () => {
        updateProxyStatus('unreachable');
      };

      function updateProxyStatus(status) {
        const el = document.getElementById('proxy-status');
        if (!el) return;
        switch (status) {
          case 'ok':
            el.textContent = 'Proxy Service: OK';
            el.className = 'ml-auto px-2 py-1 border border-green-300 border-dashed text-xs text-gray-500 bg-green-100 text-green-800';
            break;
          case 'degraded':
            el.textContent = 'Proxy Service: Degraded';
            el.className = 'ml-auto px-2 py-1 border border-yellow-300 border-dashed text-xs text-gray-500 bg-yellow-100 text-yellow-800';
            break;
          case 'unreachable':
            el.textContent = 'Proxy Service: Unreachable';
            el.className = 'ml-auto px-2 py-1 border border-red-300 border-dashed text-xs text-gray-500 bg-red-100 text-red-800 animate-pulse';
            break;
          default:
            el.textContent = 'Proxy Service: Unknown';
            el.className = 'ml-auto px-2 py-1 border border-gray-300 border-dashed text-xs text-gray-500 bg-gray-100 text-gray-800';
        }
      }

      function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      // Mirrors admin/template.go's addCostPtr: nil only when both inputs are
      // nil, so an unpriced cache rate on one side still shows the other's cost.
      function addCost(a, b) {
        if (a == null && b == null) return null;
        return (a ?? 0) + (b ?? 0);
      }

      function updateTotals(totals) {
        if (!totals) return;
        const inputTokens = totals.total_input_tokens ?? 0;
        const outputTokens = totals.total_output_tokens ?? 0;
        const cacheTokens = (totals.total_cache_creation_tokens ?? 0) + (totals.total_cache_read_tokens ?? 0);
        setText('total-input-tokens', fmtTokens(inputTokens));
        setText('total-input-cost', fmtCost(totals.total_input_cost));
        setText('total-output-tokens', fmtTokens(outputTokens));
        setText('total-output-cost', fmtCost(totals.total_output_cost));
        setText('total-cache-tokens', fmtTokens(cacheTokens));
        setText('total-cache-cost', fmtCost(addCost(totals.total_cache_creation_cost, totals.total_cache_read_cost)));
        setText('total-tokens', fmtTokens(inputTokens + outputTokens + cacheTokens));
        setText('total-cost', fmtCost(totals.total_cost));
      }

      let _knownLatestId = 0;

      async function checkExchangesUpdate(latestId) {
        if (!latestId || latestId <= _knownLatestId) return;
        _knownLatestId = latestId;
        if (typeof window._onNewExchange === 'function') window._onNewExchange();
        const tbody = document.getElementById('exchanges-tbody');
        if (!tbody) return;
        if (window._exchangesPage && window._exchangesPage > 1) return;
        const q = new URLSearchParams(window.location.search).get('q') || '';
        const limit = window._exchangesPageSize || 50;
        const url = `/exchanges?limit=${limit}${q ? `&q=${encodeURIComponent(q)}` : ''}`;
        const res = await fetch(url);
        const rows = await res.json();
        if (!rows.length) return;
        tbody.innerHTML = rows.map(buildRow).join('');
      }

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function buildRowTokenTitle(row) {
        const parts = [];
        if (row.input_tokens != null) parts.push(`<div class="flex justify-between"><b>Input:</b><span>${fmtTokens(row.input_tokens)}</span></div>`);
        if (row.output_tokens != null) parts.push(`<div class="flex justify-between"><b>Output:</b><span>${fmtTokens(row.output_tokens)}</span></div>`);
        if (row.cache_creation_tokens != null) parts.push(`<div class="flex justify-between"><b>Cache create:</b><span>${fmtTokens(row.cache_creation_tokens)}</span></div>`);
        if (row.cache_read_tokens != null) parts.push(`<div class="flex justify-between"><b>Cache read:</b><span>${fmtTokens(row.cache_read_tokens)}</span></div>`);
        return parts.length ? '<div class="w-32 flex flex-col gap-0.5">' + parts.join('') + '</div>' : '';
      }

      function buildRowCostTitle(row) {
        const parts = [];
        if (row.input_cost != null) parts.push(`<div class="flex justify-between"><b>Input:</b><span>${fmtCost(row.input_cost)}</span></div>`);
        if (row.output_cost != null) parts.push(`<div class="flex justify-between"><b>Output:</b><span>${fmtCost(row.output_cost)}</span></div>`);
        if (row.cache_creation_cost != null) parts.push(`<div class="flex justify-between"><b>Cache create:</b><span>${fmtCost(row.cache_creation_cost)}</span></div>`);
        if (row.cache_read_cost != null) parts.push(`<div class="flex justify-between"><b>Cache read:</b><span>${fmtCost(row.cache_read_cost)}</span></div>`);
        return parts.length ? '<div class="w-32 flex flex-col gap-0.5">' + parts.join('') + '</div>' : '';
      }

      function buildRow(row) {
        const { id, session_id, session_name, model, path, timestamp, input_tokens, output_tokens, cost, is_streaming, total_tokens } = row;
        const d = new Date(timestamp * 1000);
        const ts = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        const label = esc(session_name || session_id);
        const modelLabel = esc(model || '—');
        return `<tr class="hover:bg-gray-50">
          <td class="px-4 py-2"><a href="/ui/exchanges/${id}" class="text-blue-600 hover:underline">${id}</a></td>
          <td class="px-4 py-2 max-w-xs truncate text-gray-700">${label}</td>
          <td class="px-4 py-2 font-mono max-w-xs">
            <div class="flex flex-col">
              <span class="text-sm text-gray-700 truncate">${modelLabel}</span>
              <span class="text-xs text-gray-400 truncate">${esc(path)}</span>
            </div>
          </td>
          <td class="px-4 py-2 text-gray-700 whitespace-nowrap">${ts}</td>
          <td class="px-4 py-2 text-right text-gray-700" data-tip="${esc(buildRowTokenTitle(row))}">${fmtTokens(total_tokens)}</td>
          <td class="px-4 py-2 text-right text-gray-700" data-tip="${esc(buildRowCostTitle(row))}">${fmtCost(cost)}</td>
          <td class="px-4 py-2 text-gray-400 text-center">${is_streaming ? '✓' : ''}</td>
          </tr>`;
      }

      function fmtCost(c) {
        if (c == null) return '—';
        return `$${c < 0.01 ? c.toFixed(4) : c.toFixed(2)}`;
      }

      function esc(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    })();
  </script>

  {{ block "scripts" . }}{{ end }}

</body>

</html>
{{ end }}
