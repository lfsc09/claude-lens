<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyze Exchange – claude-lens Admin</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="color-scheme" content="light dark">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: 'rgb(var(--color-canvas) / <alpha-value>)',
            surface: 'rgb(var(--color-surface) / <alpha-value>)',
            'surface-hover': 'rgb(var(--color-surface-hover) / <alpha-value>)',
            'surface-active': 'rgb(var(--color-surface-active) / <alpha-value>)',
            'surface-strong': 'rgb(var(--color-surface-strong) / <alpha-value>)',
            line: 'rgb(var(--color-line) / <alpha-value>)',
            'line-strong': 'rgb(var(--color-line-strong) / <alpha-value>)',
            fg: 'rgb(var(--color-fg) / <alpha-value>)',
            'fg-muted': 'rgb(var(--color-fg-muted) / <alpha-value>)',
            'fg-subtle': 'rgb(var(--color-fg-subtle) / <alpha-value>)',
          },
        },
      },
    };
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@andypf/json-viewer@2.8.0/dist/esm/index.min.js"></script>
</head>

<body class="min-h-screen text-fg bg-canvas">

  <!-- ── Navigation ──────────────────────────────────────────────────── -->
  <site-nav active="analyze-exchange"></site-nav>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <h1 class="text-xl font-semibold mb-5">Analyze Exchange</h1>

    <div id="dropzone" tabindex="0" role="button" aria-label="Load a request payload"
      class="flex flex-col items-center justify-center text-center gap-2 py-16 px-6 border-2 border-dashed border-line-strong rounded-lg bg-surface cursor-pointer transition hover:border-emerald-400 dark:hover:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <p class="text-fg-muted font-medium">Drop a <code class="font-mono text-xs">.json</code> request file, click to browse, or paste (Ctrl/Cmd+V) raw JSON</p>
      <p class="text-xs text-fg-subtle">Nothing is uploaded anywhere — everything stays in this browser tab.</p>
      <input type="file" id="dropzone-input" accept="application/json,.json" class="hidden">
    </div>

    <p id="analyze-error" class="hidden text-sm text-red-600 dark:text-red-400 mt-4"></p>

    <div id="analyze-content" class="hidden flex-col gap-6 mt-6"></div>
  </main>

  <!-- ── Tooltip ─────────────────────────────────────────────────────────── -->
  <div id="app-tooltip" role="tooltip" class="fixed z-50 max-w-xs whitespace-pre-line text-white text-xs leading-snug px-2.5 py-1.5 rounded-md bg-gray-600 shadow-lg pointer-events-none opacity-0 transition-opacity duration-150"></div>

  <script type="module" src="/js/analyze.js"></script>
</body>

</html>
